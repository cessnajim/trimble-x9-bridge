openapi: 3.1.0
info:
  title: X9 bridge API
  version: 1.0.0-draft.3
  summary: The one API every client uses to reach a Trimble X9 scanner.
  description: |
    The bridge service runs next to the scanner (a Pi on the tripod or a desk
    machine) and is the only thing that talks to it. Every client goes through
    this API: AI agents via the MCP server, the phone web UI, the `x9` CLI,
    scripts, and agent frameworks calling these operations as functions.
    Clients enforce nothing; the rules (busy, moved, battery, queue,
    approvals) live here.

    Conventions:
    - JSON, `snake_case`. Lengths in metres, angles in radians, times in
      RFC 3339 UTC, durations in seconds.
    - `ha` is the instrument's horizontal angle as the scanner uses it
      (clockwise seen from above, `[0, 2π)`); `va` is the vertical angle from
      the zenith (`0` = straight up).
    - Long work (scans, exports, measurements) returns `202` with a `Job`;
      follow it with `GET /jobs/{job_id}` or the event stream.
    - IDs are opaque strings assigned by the bridge. Scans are keyed by the
      scanner's own scan UUID, because the scanner's numeric scan ids are
      positional and can change.
    - Errors use `application/problem+json` (RFC 9457) with a machine-readable
      `code` (see `docs/errors.md`).

    Implementation status: paths, parameters, fields and values marked
    `x-status: planned` are part of the design but not implemented by the
    bridge yet. Planned paths answer `404` with an empty body. Everything
    else is implemented. User guide: `docs/guide.md`.
servers:
  - url: http://localhost:8795/v1
    description: Bridge on this machine
  - url: http://{bridge}:8795/v1
    description: Bridge over ZeroTier or the LAN
    variables:
      bridge:
        default: bridge.local
security:
  - bearer: []
tags:
  - name: system
  - name: projects
  - name: scans
  - name: aiming
  - name: jobs
  - name: approvals
  - name: products
  - name: recipes
  - name: log

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check (no auth).
      security: []
      responses:
        "200":
          description: The bridge is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok, version]
                properties:
                  ok: { type: boolean }
                  version: { type: string }

  /status:
    get:
      tags: [system]
      operationId: getStatus
      summary: Bridge and scanner state in one read.
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        default: { $ref: "#/components/responses/Problem" }

  /rules:
    get:
      tags: [system]
      operationId: getRules
      summary: The rules the bridge enforces, with their current settings.
      responses:
        "200":
          description: Rule settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }
        default: { $ref: "#/components/responses/Problem" }

  /scan-modes:
    get:
      tags: [scans]
      operationId: listScanModes
      summary: Scan modes the scanner offers, with time and density figures.
      responses:
        "200":
          description: Modes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScanMode" }
        default: { $ref: "#/components/responses/Problem" }

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      responses:
        "200":
          description: Projects on the scanner.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project on the scanner (agent, operator, admin).
      description: |
        The bridge generates the project UUID. `name` is trimmed and must be
        1–64 bytes with no `/`. A name the scanner already has is
        `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64, pattern: "^[^/]+$" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Problem" }

  /scans:
    get:
      tags: [scans]
      operationId: listScans
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Scans, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scan" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [scans]
      operationId: startScan
      summary: Queue a full-dome or area scan.
      description: |
        Admission runs every rule. A request no rule blocks is queued; a scan
        from an `agent` token is held as `awaiting_approval` unless an active
        grant covers it. `viewer` tokens are refused (`403 forbidden`, checked
        before the body, so even a malformed request gets it). Right before
        the scanner starts, the worker checks connection, battery and storage
        again, and that the scanner is idle (a task the bridge cancelled itself
        is waited out, up to 60 s, in phase `waiting`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScan
      responses:
        "200":
          description: One scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scan" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [scans]
      operationId: deleteScan
      summary: Delete a scan from the scanner (operator only, confirmed).
      description: |
        Needs an `operator` or `admin` token (`403 forbidden`) and an
        `X-Confirm` header equal to `scan_id` (`412 confirm_mismatch`). The
        bridge also removes its cached copy of the scan file and preview and
        the exports made from the scan since it started; afterwards all of
        them are `404 not_found`.
      parameters: [{ $ref: "#/components/parameters/Confirm" }]
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/preview:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScanPreview
      summary: The scanner's preview image (grid-aligned intensity panorama).
      responses:
        "200":
          description: JPEG.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/tzf:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    get:
      tags: [scans]
      operationId: getScanTzf
      summary: The raw scan file.
      description: |
        Downloaded once and cached. Like the preview, it is served only while
        the scanner lists the scan: each request asks the scanner first
        (`404 not_found` once it is gone, `503 scanner_disconnected` when the
        scanner cannot be reached).
      responses:
        "200":
          description: TZF bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /aim:
    post:
      tags: [aiming]
      operationId: aimFromPreview
      summary: Turn a box drawn on a scan's preview into an area-scan window.
      description: |
        Refused with `409 instrument_moved` while the scanner reports it moved
        since its last scan (the scanner's own flag; the check is skipped when
        the scanner does not answer). Any role may call it; it only computes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AimRequest" }
      responses:
        "200":
          description: The window to scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AimResult" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      parameters:
        - name: state
          in: query
          x-status: planned
          description: Planned; not implemented. The bridge ignores it and returns every job.
          schema: { $ref: "#/components/schemas/JobState" }
      responses:
        "200":
          description: Every job since the bridge started, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [jobs]
      operationId: getJob
      responses:
        "200":
          description: One job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{job_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job (stops the scanner if scanning).
      description: >-
        A running scan job reads `cancelled` at once. The scanner keeps its
        task listed for a while after the stop (about 13 s on a real X9);
        the next queued scan waits for it to clear instead of failing with
        `scanner_busy`. If the scanner files what it had swept, the job gains
        `partial_scan_id` and the field log says so; keep or delete that scan.
        A `queued` or `awaiting_approval` job is cancelled at once; for a
        running scan the answer may still read `running` until the worker's
        next poll. A running export stops at its next check (during the
        download, between decoding and writing, or while writing) and reads
        `cancelled` with no export file. A granted scan cancelled before the
        scanner starts it gives its grant use back. `agent` tokens may cancel
        only jobs they requested.
      responses:
        "200":
          description: The job (cancelled, cancelling, or unchanged if already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /jobs/{job_id}/approve:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [approvals]
      operationId: approveJob
      summary: Approve one job that is awaiting approval (operator only).
      responses:
        "200":
          description: Approved and queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /grants:
    get:
      tags: [approvals]
      operationId: listGrants
      responses:
        "200":
          description: Grants that have not expired, including used-up ones.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Grant" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [approvals]
      operationId: createGrant
      summary: Let jobs inside a scope run without asking each time (operator only).
      description: |
        A grant lets `agent` scans within its limits queue without approval,
        for example "up to 12 scans in project P for the next 2 hours".
        Exports need no approval, so grants cover scans only. A grant never
        covers deletes. `scans_used` counts scans queued under it. A use is
        given back when the job is cancelled before the scanner starts it, but
        not when a job fails or is cancelled later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: Granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        default: { $ref: "#/components/responses/Problem" }

  /grants/{grant_id}:
    parameters:
      - { name: grant_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [approvals]
      operationId: revokeGrant
      responses:
        "204": { description: Revoked. }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/exports:
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    post:
      tags: [products]
      operationId: exportPoints
      summary: Decode the scan to levelled points and write a file.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: Queued; the job's result is an `Export`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /exports/{export_id}:
    parameters:
      - { name: export_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getExport
      responses:
        "200":
          description: Export metadata and its checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        default: { $ref: "#/components/responses/Problem" }

  /exports/{export_id}/file:
    parameters:
      - { name: export_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getExportFile
      responses:
        "200":
          description: The PLY or LAS file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /scans/{scan_id}/measurements:
    x-status: planned
    parameters: [{ $ref: "#/components/parameters/ScanId" }]
    post:
      tags: [products]
      operationId: measure
      x-status: planned
      summary: Measure a feature in a scan (runs in the measurement worker).
      description: Planned; not implemented. The measurement worker is not built yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeasurementRequest" }
      responses:
        "202":
          description: Queued; the job's result is a `Measurement`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }

  /measurements/{measurement_id}:
    x-status: planned
    parameters:
      - { name: measurement_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getMeasurement
      x-status: planned
      description: Planned; not implemented.
      responses:
        "200":
          description: Values, uncertainties, checks and the evidence image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Measurement" }
        default: { $ref: "#/components/responses/Problem" }

  /measurements/{measurement_id}/evidence:
    x-status: planned
    parameters:
      - { name: measurement_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [products]
      operationId: getMeasurementEvidence
      x-status: planned
      summary: The annotated check image for a person or a vision model to verify.
      description: Planned; not implemented.
      responses:
        "200":
          description: PNG.
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /recipes:
    get:
      tags: [recipes]
      operationId: listRecipes
      responses:
        "200":
          description: Installed recipes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeSummary" }
        default: { $ref: "#/components/responses/Problem" }

  /recipes/{recipe_id}:
    parameters:
      - { name: recipe_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [recipes]
      operationId: getRecipe
      responses:
        "200":
          description: The recipe, as data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        default: { $ref: "#/components/responses/Problem" }

  /runs:
    get:
      tags: [recipes]
      operationId: listRuns
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [recipes]
      operationId: startRun
      summary: Start running a recipe (agent, operator, admin).
      description: |
        The run executes under the starter's role and name, so approvals and
        grants apply as for direct requests. Every declared input is
        required; inputs with `choices` must be one of them. See
        `docs/recipes.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipe_id, project_id]
              properties:
                recipe_id: { type: string }
                project_id: { type: string }
                inputs:
                  type: object
                  additionalProperties: true
                  description: Values for the recipe's declared inputs.
      responses:
        "201":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{run_id}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [recipes]
      operationId: getRun
      responses:
        "200":
          description: The run and the state of each step.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{run_id}/advance:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [recipes]
      operationId: advanceRun
      summary: Complete the current step that waits on someone (a choice, a confirmation, a box on the preview).
      description: |
        Only the run's starter (same token name), an `operator` or an `admin`;
        another `agent` gets `403 forbidden`, checked before the body is read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_id]
              properties:
                step_id: { type: string }
                input:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Updated run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /runs/{run_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    post:
      tags: [recipes]
      operationId: cancelRun
      summary: Stop a run; a scan or export in flight is cancelled too.
      description: |
        Only the run's starter (same token name), an `operator` or an `admin`;
        another `agent` gets `403 forbidden`.
      responses:
        "200":
          description: The run (it settles to `cancelled` shortly).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Problem" }

  /log:
    get:
      tags: [log]
      operationId: getLog
      summary: The field log, oldest first.
      description: In memory; it starts empty when the bridge starts.
      parameters:
        - { name: since, in: query, description: Entries at or after this time., schema: { type: string, format: date-time } }
        - { name: project_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogEntry" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [log]
      operationId: addLogNote
      summary: Add a note (a person's or an agent's observation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000, description: Not only spaces. }
                project_id: { type: string }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        default: { $ref: "#/components/responses/Problem" }

  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: Server-sent events for job progress, status changes and log entries.
      responses:
        "200":
          description: |
            `text/event-stream`. Event types: `job` (data: a `Job`), `run`
            (data: a `Run`) and `log` (data: a `LogEntry`). Each event's data
            is the full JSON object on one line, so a client never needs to
            re-fetch. `job` events are also sent on every scanner poll while a
            scan runs. Events are not replayed; a client more than 256 events
            behind skips the missed ones. A `status` event is planned
            (`x-status: planned`); poll `GET /status` for now.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        One token per user or device, from the bridge's token file. Each token
        has a role: `viewer` (read only, plus `POST /aim`), `agent` (read,
        queue work; scans need approval or a grant; cancel only its own jobs;
        advance or cancel only runs it started), `operator` (everything an
        agent can, plus approvals, grants, cancelling any job, steering any
        run and confirmed deletes) or `admin`. In this version `admin` has
        exactly the rights of `operator`; changing rule settings and tokens
        over the API is planned.

  parameters:
    ScanId:
      name: scan_id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    Confirm:
      name: X-Confirm
      in: header
      required: true
      description: Must repeat the id of the resource being deleted.
      schema: { type: string }

  responses:
    Problem:
      description: An error, with a machine-readable code.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            See `docs/errors.md`. `needs_approval` and `worker_unavailable` are
            planned and never returned in this version. `scanner_error` (502)
            is the scanner answering with an error status other than 409;
            `cache_error` (500) is the bridge failing to read or write its own
            files.
          enum:
            - unauthorized
            - forbidden
            - not_found
            - invalid_request
            - scanner_disconnected
            - scanner_busy
            - scanner_error
            - cache_error
            - instrument_moved
            - battery_low
            - storage_low
            - needs_approval
            - confirm_mismatch
            - decode_failed
            - check_failed
            - worker_unavailable
            - conflict
        hint:
          type: string
          description: What a client or person can do to clear it.

    Status:
      type: object
      required: [bridge, scanner]
      properties:
        bridge:
          type: object
          required: [version, started_at]
          properties:
            version: { type: string }
            started_at: { type: string, format: date-time }
            queue_length:
              type: integer
              description: Scan jobs `queued` or `awaiting_approval`.
            worker_ready:
              type: boolean
              description: Whether the measurement worker is available. Always `false` in this version.
        scanner:
          type: object
          required: [connected]
          description: When `connected` is false, the other fields are absent.
          properties:
            connected: { type: boolean }
            busy: { type: boolean, description: The scanner reports a current task (from any client). }
            current_job_id:
              type: [string, "null"]
              description: The bridge's scan job in state `running`. Exports run beside the scanner and never show here.
            battery_pct: { type: integer, minimum: 0, maximum: 100 }
            on_ac_power: { type: boolean }
            storage_free_bytes: { type: integer }
            moved_since_last_scan: { type: boolean }
            leveling:
              type: object
              properties:
                state:
                  type: string
                  enum: [none, in_progress, ok, error]
                  description: "`in_progress` stands for any value the scanner reports other than ok, none and error."
                compensator_on: { type: boolean }
                tilt_rad:
                  type: array
                  description: The two compensator readings, radians.
                  items: { type: number }
                  minItems: 2
                  maxItems: 2

    Rules:
      type: object
      properties:
        min_battery_pct_to_scan: { type: integer, default: 15 }
        min_storage_free_bytes: { type: integer, default: 2000000000 }
        require_approval_for_scans: { type: boolean, default: true }
        refuse_aim_after_move: { type: boolean, default: true }
        max_queue_length: { type: integer, default: 20 }

    ScanMode:
      type: object
      required: [mode, range_m, angular_step_rad, fixed_seconds, full_dome_seconds]
      properties:
        mode: { type: string, examples: [STD_L0, STD_L2, HS_L1] }
        range_m: { type: number }
        angular_step_rad: { type: number }
        points_full_dome: { type: integer }
        fixed_seconds:
          type: number
          description: Overhead every scan pays (leveling to file ready).
        full_dome_seconds:
          type: number
          description: The scanner's own estimate for a full-dome scan in this mode (color off).

    Project:
      type: object
      required: [project_id, name]
      properties:
        project_id: { type: string }
        name: { type: string }
        scan_count:
          type: integer
          description: Stations (full-dome scans) the scanner has numbered in the project; area scans are not counted.

    Window:
      type: object
      description: An area-scan window. `start_ha + delta_ha` may exceed 2π (the window crosses the seam). `start_va + delta_va` must not exceed π.
      required: [start_ha, delta_ha, start_va, delta_va]
      properties:
        start_ha: { type: number, minimum: 0, exclusiveMaximum: 6.283185307179586 }
        delta_ha: { type: number, exclusiveMinimum: 0, maximum: 6.283185307179586 }
        start_va: { type: number, minimum: 0, maximum: 3.141592653589793 }
        delta_va: { type: number, exclusiveMinimum: 0, maximum: 3.141592653589793 }

    ScanRequest:
      type: object
      required: [project_id, kind, mode]
      properties:
        project_id: { type: string }
        kind: { type: string, enum: [full_dome, area] }
        mode: { type: string, examples: [STD_L0, STD_L2] }
        color:
          type: boolean
          default: false
          description: Camera images after the sweep. Adds ~150 s; off by default.
        window:
          $ref: "#/components/schemas/Window"
          description: Required when `kind` is `area`; refused for `full_dome`.
        note: { type: string, description: Recorded in the field log. }

    Scan:
      type: object
      required: [scan_id, project_id, kind, mode]
      properties:
        scan_id: { type: string }
        project_id: { type: string }
        parent_scan_id:
          type: [string, "null"]
          description: For area scans, the station scan they belong to.
        station: { type: integer, description: Station number within the project. }
        kind: { type: string, enum: [full_dome, area] }
        mode: { type: string }
        color: { type: boolean }
        window:
          $ref: "#/components/schemas/Window"
          description: Area scans the bridge ran since it started.
        created_at:
          type: [string, "null"]
          format: date-time
          description: Known only for scans this bridge ran since it started (when the job started); the scanner doesn't record it.
        grid:
          type: object
          x-status: planned
          description: Planned; not returned yet.
          properties:
            rows: { type: integer }
            cols: { type: integer }
        point_count: { type: integer }
        tzf_bytes: { type: integer }
        has_intensity:
          type: boolean
          x-status: planned
          description: Planned; not returned yet. Whether the scan file itself carries intensity (otherwise the preview supplies it).
        timings:
          type: object
          description: >-
            Seconds from when the bridge sent the scan to the scanner, as
            observed. Only for scans this bridge ran since it started; empty
            for a partial scan from a cancelled job.
          properties:
            leveling_s: { type: number }
            sweep_s: { type: number }
            geometry_ready_s: { type: number }
            done_s: { type: number }

    AimRequest:
      type: object
      required: [reference_scan_id, box]
      properties:
        reference_scan_id:
          type: string
          description: A scan from the current station whose preview the box was drawn on.
        box:
          type: object
          description: Preview pixels, y down. `x1 < x0` wraps across the panorama seam.
          required: [x0, y0, x1, y1]
          properties:
            x0: { type: integer, minimum: 0 }
            y0: { type: integer, minimum: 0 }
            x1: { type: integer, minimum: 0 }
            y1: { type: integer, minimum: 0 }
        margin_rad: { type: number, default: 0.009, description: Padding on every side, radians. Negative values count as 0. }

    AimResult:
      type: object
      required: [window, preview_size, cells_per_pixel]
      properties:
        window: { $ref: "#/components/schemas/Window" }
        preview_size:
          type: array
          description: Width and height of the reference preview, pixels.
          items: { type: integer }
          minItems: 2
          maxItems: 2
        cells_per_pixel:
          type: array
          description: Scan grid cells per preview pixel, horizontal and vertical.
          items: { type: number }
          minItems: 2
          maxItems: 2
        estimated_seconds:
          type: object
          x-status: planned
          description: Planned; not returned yet. Predicted time per mode, from the mode's fixed and sweep figures.
          additionalProperties: { type: number }

    JobState:
      type: string
      enum: [awaiting_approval, queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      required: [job_id, kind, state, created_at]
      properties:
        job_id: { type: string }
        kind:
          type: string
          enum: [scan, export, measurement]
          description: "`measurement` is planned (`x-status: planned`)."
        state: { $ref: "#/components/schemas/JobState" }
        phase:
          type: string
          description: >-
            Scans: `waiting` (for the scanner to clear a task the bridge
            cancelled), `leveling`, `sweeping`, `imaging` (color only).
            Exports: `downloading`, `decoding`. Absent once the job finishes.
          enum: [waiting, leveling, sweeping, imaging, downloading, decoding]
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: The scanner's task percentage (restarts during color imaging); 1 when a job succeeds.
        requested_by: { type: string, description: Token name. }
        run_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        result:
          description: Set when `state` is `succeeded`.
          oneOf:
            - { $ref: "#/components/schemas/ScanRef" }
            - { $ref: "#/components/schemas/ExportRef" }
            - { $ref: "#/components/schemas/MeasurementRef" }
        problem: { $ref: "#/components/schemas/Problem" }
        partial_scan_id:
          type: string
          description: >-
            Cancelled scan jobs only: the scan the scanner filed from the
            partial sweep. Set shortly after the cancel, once the scanner
            files it (a `job` event announces the change).

    ScanRef:
      type: object
      required: [scan_id]
      properties: { scan_id: { type: string } }
    ExportRef:
      type: object
      required: [export_id]
      properties: { export_id: { type: string } }
    MeasurementRef:
      type: object
      x-status: planned
      required: [measurement_id]
      properties: { measurement_id: { type: string } }

    GrantRequest:
      type: object
      required: [project_id, expires_at]
      properties:
        project_id: { type: string, description: Not checked against the scanner. }
        expires_at: { type: string, format: date-time, description: Must be in the future. }
        max_scans: { type: [integer, "null"], minimum: 0, description: Omitted or null for no limit. }
        allowed_modes:
          type: array
          description: Empty for any mode.
          items: { type: string }
        allow_color: { type: boolean, default: false }
        run_id:
          type: [string, "null"]
          description: Limit the grant to one recipe run. Not checked against existing runs.

    Grant:
      allOf:
        - $ref: "#/components/schemas/GrantRequest"
        - type: object
          required: [grant_id, granted_by, scans_used]
          properties:
            grant_id: { type: string }
            granted_by: { type: string }
            scans_used: { type: integer }

    Check:
      type: object
      description: One automatic check on a product. Clients should not use a product whose checks failed without saying so.
      required: [name, ok]
      properties:
        name:
          type: string
          description: Exports produce `point_count`, `levelled`, `coordinates` and `intensity` (always ok).
          examples: [point_count, levelled, coordinates, intensity]
        ok: { type: boolean }
        value: { type: number }
        threshold:
          type: number
          x-status: planned
          description: Planned; not returned yet.
        unit: { type: string }
        detail: { type: string }

    ExportRequest:
      type: object
      required: [format]
      properties:
        format: { type: string, enum: [ply, las] }
        intensity:
          type: string
          enum: [auto, scan, preview, none]
          default: auto
          description: >-
            The scan file's own intensity is not decoded yet: `auto` and `scan`
            use the scan's preview when it can be downloaded, else mid-grey.
            `preview` fails the export (`decode_failed`) without a preview.
            `none` writes mid-grey. Points are always levelled.

    Export:
      type: object
      required: [export_id, scan_id, format, point_count, checks]
      properties:
        export_id: { type: string }
        scan_id: { type: string }
        format: { type: string, enum: [ply, las] }
        point_count: { type: integer }
        bytes: { type: integer }
        bounds_m:
          type: object
          properties:
            min: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
            max: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }

    MeasurementRequest:
      type: object
      x-status: planned
      required: [kind]
      properties:
        kind:
          type: string
          enum: [opening]
          description: v1 measures one thing well; more kinds come later.
        hint_box:
          type: object
          description: Optional preview box around the feature (same form as `AimRequest.box`).
          properties:
            x0: { type: integer }
            y0: { type: integer }
            x1: { type: integer }
            y1: { type: integer }
        avoid:
          type: array
          description: Preview boxes to ignore (a plant, a person).
          items:
            type: object
            properties:
              x0: { type: integer }
              y0: { type: integer }
              x1: { type: integer }
              y1: { type: integer }

    Measurement:
      type: object
      x-status: planned
      required: [measurement_id, scan_id, kind, values, checks, evidence_url]
      properties:
        measurement_id: { type: string }
        scan_id: { type: string }
        kind: { type: string }
        values:
          type: array
          items:
            type: object
            required: [name, value_m, uncertainty_m]
            properties:
              name:
                type: string
                examples: [opening_width, opening_height, frame_depth, glass_width_left]
              value_m: { type: number }
              uncertainty_m: { type: number }
              basis: { type: string, description: How it was measured, in one line. }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        evidence_url:
          type: string
          description: Relative URL of the annotated check image.

    RecipeSummary:
      type: object
      required: [recipe_id, title, version]
      properties:
        recipe_id: { type: string, examples: [window-measurement] }
        title: { type: string }
        version: { type: string }
        summary: { type: string }

    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          required: [steps]
          properties:
            inputs:
              type: array
              items:
                type: object
                required: [name, type]
                properties:
                  name: { type: string }
                  type:
                    type: string
                    description: A hint for clients; the bridge does not check it.
                    examples: [string, number, boolean, choice]
                  choices: { type: array, items: { type: string } }
                  prompt: { type: string }
            steps:
              type: array
              items: { $ref: "#/components/schemas/RecipeStep" }

    RecipeStep:
      type: object
      description: |
        One step. `action` steps call an API operation; `person` steps wait
        for someone (move the tripod, confirm, draw a box) via `advance`.
      required: [step_id, title, kind]
      properties:
        step_id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [action, person, check] }
        operation_id:
          type: string
          enum: [startScan, aimFromPreview, exportPoints, addLogNote]
          description: For `action` steps, the API operation to call.
        arguments:
          type: object
          additionalProperties: true
          description: >-
            Fixed arguments. Strings may hold `{{project_id}}`,
            `{{input.<name>}}` and `{{steps.<id>.<field>…}}` placeholders; a
            string that is exactly one placeholder takes the referenced
            value's type. See `docs/recipes.md`.
        instructions: { type: string, description: What to tell the person, for `person` steps. }
        needs:
          type: array
          description: For `person` steps, the fields `advance` must supply.
          items: { type: string }
        preview_of: { type: string, description: For `person` steps, an earlier step whose scan preview to show. }
        of: { type: string, description: For `check` steps, the earlier step whose checks are inspected. }
        expect:
          type: array
          description: For `check` steps, the checks that must pass.
          items: { type: string }

    Run:
      type: object
      required: [run_id, recipe_id, project_id, state, steps]
      properties:
        run_id: { type: string }
        recipe_id: { type: string }
        project_id: { type: string }
        state:
          type: string
          enum: [running, waiting_for_person, succeeded, failed, cancelled]
          description: "`waiting_for_person` covers both an approval and a person step; see `waiting_for`."
        waiting_for:
          type: [string, "null"]
          enum: [approval, input, null]
          description: When waiting, whether for an operator's approval or a person step's input.
        recipe_version: { type: string }
        started_by: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        problem: { $ref: "#/components/schemas/Problem" }
        current_step_id: { type: [string, "null"] }
        steps:
          type: array
          items:
            type: object
            required: [step_id, state]
            properties:
              step_id: { type: string }
              state: { type: string, enum: [pending, running, waiting, done, failed, skipped] }
              job_id: { type: [string, "null"] }
              output: { type: object, additionalProperties: true }

    LogEntry:
      type: object
      required: [entry_id, at, kind, text]
      properties:
        entry_id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [note, scan, export, run, check, approval, rule, error] }
        text: { type: string }
        author: { type: string, description: Token name, or "bridge". }
        project_id: { type: [string, "null"] }
        refs:
          type: object
          additionalProperties: { type: string }
          description: Related ids (job_id, scan_id, run_id, step_id, grant_id, export_id).

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="Building a field kit in seven layers, each with a check before the next: the Pi, the USB-C link, the scanner links, the bridge, the MCP server, the laptop, and an acceptance scan. A person is needed in steps 1, 3 and 7." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .chk { fill: #dafbe1; stroke: #1a7f37; }
    .t { fill: #1f2328; }
    .m { fill: #57606a; }
    .g { fill: #1a7f37; }
    .num { fill: #0969da; }
    .numt { fill: #ffffff; }
    .ln { stroke: #57606a; fill: none; }
    .lnf { fill: #57606a; }
    .per { fill: #9a6700; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .chk { fill: #0f2a18; stroke: #3fb950; }
      .t { fill: #e6edf3; }
      .m { fill: #8b949e; }
      .g { fill: #3fb950; }
      .num { fill: #4493f8; }
      .numt { fill: #0d1117; }
      .ln { stroke: #8b949e; }
      .lnf { fill: #8b949e; }
      .per { fill: #d29922; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="lnf"/></marker>
  </defs>

  <!-- seven columns, 124 wide, 12 apart, starting at x=10 -->
  <g font-size="11">
    <!-- 1 -->
    <rect x="10" y="20" width="124" height="104" rx="8" class="box"/>
    <circle cx="30" cy="40" r="11" class="num"/><text x="30" y="44" text-anchor="middle" font-weight="700" class="numt">1</text>
    <text x="47" y="44" font-size="13" font-weight="700" class="t">The Pi</text>
    <text x="20" y="72" class="t">Raspberry Pi OS</text>
    <text x="20" y="88" class="t">ssh key, sudo</text>
    <text x="20" y="114" class="per" font-weight="600">● person</text>
    <rect x="10" y="140" width="124" height="44" rx="8" class="chk"/>
    <text x="20" y="158" class="g" font-weight="600">check</text>
    <text x="20" y="174" class="t">aarch64</text>

    <!-- 2 -->
    <rect x="146" y="20" width="124" height="104" rx="8" class="box"/>
    <circle cx="166" cy="40" r="11" class="num"/><text x="166" y="44" text-anchor="middle" font-weight="700" class="numt">2</text>
    <text x="183" y="44" font-size="13" font-weight="700" class="t">USB-C link</text>
    <text x="156" y="72" class="t">NCM gadget</text>
    <text x="156" y="88" class="t">DHCP, no gateway</text>
    <rect x="146" y="140" width="124" height="44" rx="8" class="chk"/>
    <text x="156" y="158" class="g" font-weight="600">check (after 3)</text>
    <text x="156" y="174" class="t">laptop: 10.55.0.x</text>

    <!-- 3 -->
    <rect x="282" y="20" width="124" height="104" rx="8" class="box"/>
    <circle cx="302" cy="40" r="11" class="num"/><text x="302" y="44" text-anchor="middle" font-weight="700" class="numt">3</text>
    <text x="319" y="44" font-size="13" font-weight="700" class="t">X9 links</text>
    <text x="292" y="72" class="t">x9-wifi, x9-usb</text>
    <text x="292" y="88" class="t">Wi-Fi preferred</text>
    <text x="292" y="114" class="per" font-weight="600">● passphrase</text>
    <rect x="282" y="140" width="124" height="44" rx="8" class="chk"/>
    <text x="292" y="158" class="g" font-weight="600">check</text>
    <text x="292" y="174" class="t">scanner: 200</text>

    <!-- 4 -->
    <rect x="418" y="20" width="124" height="104" rx="8" class="box"/>
    <circle cx="438" cy="40" r="11" class="num"/><text x="438" y="44" text-anchor="middle" font-weight="700" class="numt">4</text>
    <text x="455" y="44" font-size="13" font-weight="700" class="t">Bridge</text>
    <text x="428" y="72" class="t">service, tokens</text>
    <text x="428" y="88" class="t">0.0.0.0:8795</text>
    <rect x="418" y="140" width="124" height="44" rx="8" class="chk"/>
    <text x="428" y="158" class="g" font-weight="600">check</text>
    <text x="428" y="174" class="t">/v1/health</text>

    <!-- 5 -->
    <rect x="554" y="20" width="124" height="104" rx="8" class="box"/>
    <circle cx="574" cy="40" r="11" class="num"/><text x="574" y="44" text-anchor="middle" font-weight="700" class="numt">5</text>
    <text x="591" y="44" font-size="13" font-weight="700" class="t">MCP server</text>
    <text x="564" y="72" class="t">offline wheelhouse</text>
    <text x="564" y="88" class="t">launcher</text>
    <rect x="554" y="140" width="124" height="44" rx="8" class="chk"/>
    <text x="564" y="158" class="g" font-weight="600">check</text>
    <text x="564" y="174" class="t">it imports</text>

    <!-- 6 -->
    <rect x="690" y="20" width="124" height="104" rx="8" class="box"/>
    <circle cx="710" cy="40" r="11" class="num"/><text x="710" y="44" text-anchor="middle" font-weight="700" class="numt">6</text>
    <text x="727" y="44" font-size="13" font-weight="700" class="t">Laptop</text>
    <text x="700" y="72" class="t">ssh alias</text>
    <text x="700" y="88" class="t">claude mcp add</text>
    <rect x="690" y="140" width="124" height="44" rx="8" class="chk"/>
    <text x="700" y="158" class="g" font-weight="600">check</text>
    <text x="700" y="174" class="t">scanner_* tools</text>

    <!-- 7 -->
    <rect x="826" y="20" width="124" height="104" rx="8" class="box"/>
    <circle cx="846" cy="40" r="11" class="num"/><text x="846" y="44" text-anchor="middle" font-weight="700" class="numt">7</text>
    <text x="863" y="44" font-size="13" font-weight="700" class="t">Acceptance</text>
    <text x="836" y="72" class="t">one full dome</text>
    <text x="836" y="88" class="t">via the agent</text>
    <text x="836" y="114" class="per" font-weight="600">● scanner on</text>
    <rect x="826" y="140" width="124" height="44" rx="8" class="chk"/>
    <text x="836" y="158" class="g" font-weight="600">check</text>
    <text x="836" y="174" class="t">registered, mapped</text>
  </g>

  <!-- order -->
  <g class="ln" stroke-width="1.5">
    <line x1="134" y1="72" x2="144" y2="72" marker-end="url(#a)"/>
    <line x1="270" y1="72" x2="280" y2="72" marker-end="url(#a)"/>
    <line x1="406" y1="72" x2="416" y2="72" marker-end="url(#a)"/>
    <line x1="542" y1="72" x2="552" y2="72" marker-end="url(#a)"/>
    <line x1="678" y1="72" x2="688" y2="72" marker-end="url(#a)"/>
    <line x1="814" y1="72" x2="824" y2="72" marker-end="url(#a)"/>
  </g>

  <text x="10" y="222" font-size="12" class="m">Each layer is checked before the next. ● marks the steps that need a person at the kit; everything else an agent can do over ssh.</text>
</svg>
